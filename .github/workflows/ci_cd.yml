name: MCP Lab CI

on:
  workflow_dispatch:   # Allows manual trigger from the GitHub Actions UI
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MCP_API_KEYS: 'test-key-123'
        run: npm test -- --forceExit

      - name: Run HTTP Server Integration Tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MCP_API_KEYS: 'test-key-123'
          PORT: 3000
        run: |
          # 1. Start the HTTP server in the background
          node mcp-server/http_server.js &
          SERVER_PID=$!

          # 2. Verify health endpoint is reachable
          sleep 2
          curl -f http://localhost:3000/health || exit 1

          # 3. Run the HTTP/SSE integration test suite
          MCP_SERVER_URL=http://localhost:3000 MCP_API_KEY=test-key-123 npx jest tests/integration/http_server.test.js --forceExit

          # 4. Stop the background server process
          kill $SERVER_PID

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud using your Service Account JSON secret
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Set up the Google Cloud SDK CLI on the runner
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      # 3. Build and push container image using Cloud Build (Module 8.5.3)
      - name: 'Build and Push to Container Registry'
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/mcp-server

      # 4. Deploy the updated image to Cloud Run securely
      - name: 'Deploy to Cloud Run'
        run: |
          gcloud run deploy mcp-server \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/mcp-server \
            --platform managed \
            --region us-central1 \
            --port 3000 \
            --no-allow-unauthenticated \
            --set-env-vars NODE_ENV=production,PORT=3000 \
            --set-secrets ANTHROPIC_API_KEY=anthropic-key:latest,MCP_API_KEYS=mcp-keys:latest
