deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Set up Google Cloud SDK
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      # 3. Build and push container image using Cloud Build (Module 8.5.3)
      - name: 'Build and Push to Container Registry'
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/mcp-server

      # 4. Deploy to Cloud Run
      - name: 'Deploy to Cloud Run'
        run: |
          gcloud run deploy mcp-server \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/mcp-server \
            --platform managed \
            --region us-central1 \
            --port 3000 \
            --no-allow-unauthenticated \
            --set-env-vars NODE_ENV=production,PORT=3000 \
            --set-secrets ANTHROPIC_API_KEY=anthropic-key:latest,MCP_API_KEYS=mcp-keys:latest
